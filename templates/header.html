<header class="bg-white shadow-sm">
    <div class="flex items-center justify-between px-6 py-4">
        <div class="flex items-center space-x-4">
            <button id="sidebar-toggle" class="text-gray-500 focus:outline-none">
                <i class="fas fa-bars text-xl"></i>
            </button>
            <h1 class="text-xl font-bold text-gray-800" id="page-title"></h1>
        </div>

        <div class="flex items-center space-x-6">
            <div class="relative flex items-center space-x-3">
                <!-- Icône utilisateur -->
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-lg">
                        <i class="fas fa-user-nurse"></i>
                    </div>

                    <!-- Indicateur de statut -->
                    <span class="absolute bottom-0 right-0 block w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
                </div>

                <!-- Nom de l'utilisateur -->
                <span class="text-gray-700 font-medium hidden md:inline">
                    {{ request.user.nom }}
                    <p class="text-xs text-gray-500">{{ request.user.role.designation }}</p>
                </span>
            </div>
        </div>
    </div>
</header>
