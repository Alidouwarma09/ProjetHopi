{% extends 'base.html' %}
{% load static %}
{% block content %}
    <body class="bg-gray-100 font-sans">
        <div class="flex h-screen overflow-hidden">
             <div class="flex-1 overflow-auto">
        <header class="bg-white shadow-sm">
                <div class="flex items-center justify-between px-6 py-4">
                    <div class="flex items-center space-x-4">
                        <h1 class="text-xl font-bold text-gray-800">Paramètres du système</h1>
                    </div>
                    
                    <div class="flex items-center space-x-6">
                        <div class="relative">
                            <button class="text-gray-500 focus:outline-none">
                                <i class="fas fa-bell text-xl"></i>
                                <span class="animate-pulse absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">3</span>
                            </button>
                        </div>
                        <div class="relative">
                            <button class="text-gray-500 focus:outline-none">
                                <i class="fas fa-envelope text-xl"></i>
                                <span class="animate-pulse absolute -top-1 -right-1 bg-blue-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">5</span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>
   <main class="p-6">
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    <!-- Settings Navigation -->
                    <div class="lg:col-span-1">
                        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                            <div class="p-4 border-b border-gray-200">
                                <h2 class="text-lg font-semibold text-gray-800">Menu des paramètres</h2>
                            </div>
                            <div class="divide-y divide-gray-200">
                                <a href="#" class="block p-4 hover:bg-gray-50 text-blue-600 font-medium border-l-4 border-blue-600">
                                    <i class="fas fa-cog mr-2"></i> Général
                                </a>
                                <a href="#" class="block p-4 hover:bg-gray-50 text-gray-600">
                                    <i class="fas fa-user-shield mr-2"></i> Sécurité
                                </a>
                                <a href="#" class="block p-4 hover:bg-gray-50 text-gray-600">
                                    <i class="fas fa-bell mr-2"></i> Notifications
                                </a>
                                <a href="#" class="block p-4 hover:bg-gray-50 text-gray-600">
                                    <i class="fas fa-file-invoice mr-2"></i> Facturation
                                </a>
                                <a href="#" class="block p-4 hover:bg-gray-50 text-gray-600">
                                    <i class="fas fa-calendar-alt mr-2"></i> Rendez-vous
                                </a>
                                <a href="#" class="block p-4 hover:bg-gray-50 text-gray-600">
                                    <i class="fas fa-pills mr-2"></i> Pharmacie
                                </a>
                                <a href="#" class="block p-4 hover:bg-gray-50 text-gray-600">
                                    <i class="fas fa-database mr-2"></i> Sauvegarde
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Settings Content -->
                    <div class="lg:col-span-3 space-y-6">
                        <!-- General Settings Card -->
                        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                            <div class="p-4 border-b border-gray-200">
                                <h2 class="text-lg font-semibold text-gray-800 flex items-center">
                                    <i class="fas fa-cog mr-2 text-blue-600"></i> Paramètres généraux
                                </h2>
                            </div>
                            <div class="p-6">
                                <form class="space-y-6">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Nom de l'établissement</label>
                                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" value="Pharmacie MediCare">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Adresse email</label>
                                            <input type="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" value="contact@medicare.com">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
                                            <input type="tel" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" value="+33 1 23 45 67 89">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
                                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" value="123 Rue de la Santé, Paris">
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                                        <textarea rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">Pharmacie et centre médical offrant des services de qualité depuis 2010.</textarea>
                                    </div>
                                    
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Logo</label>
                                        <div class="mt-1 flex items-center">
                                            <span class="inline-block h-12 w-12 rounded-full overflow-hidden bg-gray-100">
                                                <img src="https://via.placeholder.com/48" alt="Logo" class="h-full w-full">
                                            </span>
                                            <button type="button" class="ml-5 bg-white py-2 px-3 border border-gray-300 rounded-lg shadow-sm text-sm leading-4 font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                                Changer
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div class="flex justify-end">
                                        <button type="button" class="bg-white py-2 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 mr-3">
                                            Annuler
                                        </button>
                                        <button type="submit" class="bg-blue-600 py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                            Enregistrer
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        
                        <!-- Business Hours Card -->
                        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                            <div class="p-4 border-b border-gray-200">
                                <h2 class="text-lg font-semibold text-gray-800 flex items-center">
                                    <i class="fas fa-clock mr-2 text-blue-600"></i> Heures d'ouverture
                                </h2>
                            </div>
                            <div class="p-6">
                                <form class="space-y-4">
                                    <div class="space-y-4">
                                        <div class="flex items-center justify-between">
                                            <label class="text-sm font-medium text-gray-700">Lundi</label>
                                            <div class="flex items-center space-x-2">
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="08:00">
                                                <span>à</span>
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="19:00">
                                            </div>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <label class="text-sm font-medium text-gray-700">Mardi</label>
                                            <div class="flex items-center space-x-2">
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="08:00">
                                                <span>à</span>
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="19:00">
                                            </div>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <label class="text-sm font-medium text-gray-700">Mercredi</label>
                                            <div class="flex items-center space-x-2">
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="08:00">
                                                <span>à</span>
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="19:00">
                                            </div>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <label class="text-sm font-medium text-gray-700">Jeudi</label>
                                            <div class="flex items-center space-x-2">
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="08:00">
                                                <span>à</span>
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="19:00">
                                            </div>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <label class="text-sm font-medium text-gray-700">Vendredi</label>
                                            <div class="flex items-center space-x-2">
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="08:00">
                                                <span>à</span>
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="19:00">
                                            </div>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <label class="text-sm font-medium text-gray-700">Samedi</label>
                                            <div class="flex items-center space-x-2">
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="09:00">
                                                <span>à</span>
                                                <input type="time" class="border border-gray-300 rounded-lg px-3 py-1" value="13:00">
                                            </div>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <label class="text-sm font-medium text-gray-700">Dimanche</label>
                                            <div class="flex items-center">
                                                <span class="text-sm text-gray-500">Fermé</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="flex justify-end">
                                        <button type="button" class="bg-white py-2 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 mr-3">
                                            Annuler
                                        </button>
                                        <button type="submit" class="bg-blue-600 py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                            Enregistrer
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
     </main>
      </div>
    </body>
    
{% endblock %}
